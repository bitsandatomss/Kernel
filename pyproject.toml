[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-kernel"
version = "0.1.0"
description = "Executable, branchable surrogate of OS kernel dynamics (learned-surrogate research prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "numpy>=1.24"]
authors = [{ name = "Virtual Kernel contributors" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kernel*", "virtual_kernel*", "benchmarks*", "experiments*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_temp"
